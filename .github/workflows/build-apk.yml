name: Build Photo-CIE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Gradle
        run: |
          ls -la
          head -20 gradlew
          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew clean
          ./gradlew :app:assembleDebug --stacktrace --info

      - name: Find APK
        run: |
          find . -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo-CIE-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
