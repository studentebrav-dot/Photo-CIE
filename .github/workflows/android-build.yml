 name: Android CI - build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -e
          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace

      - name: Show build outputs
        run: |
          echo "Listing app/build/outputs"
          ls -R app/build/outputs || true
          echo "Listing all module build outputs"
          ls -R **/build/outputs || true

      - name: Upload any APKs and AABs found
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: |
            app/build/outputs/**/*.apk
            **/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
            **/build/outputs/**/*.aab
